[project]
name = "research-agent"
version = "0.1.0"
description = "Series S1: a LangGraph research agent built with Claude Code, running on a local Qwen"
requires-python = ">=3.12"
dependencies = [
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
markers = ["live: calls the local model server (skipped unless AGENT_LIVE=1)"]
