[project]
name = "docs-mcp"
version = "0.1.0"
description = "Series S4: an MCP server over local doc pages, built with Claude Code"
requires-python = ">=3.12"
dependencies = [
    "fastmcp>=4.1.6",
]

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
